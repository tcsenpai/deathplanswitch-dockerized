# Death Plan Switch inside Docker. The data folder lives at /data, outside
# the web root, so it has no URL at all. These rules also keep the code
# folders and stray files out of reach, as docs/nginx.conf.example does.

ServerTokens Prod
ServerSignature Off

# TLS ends at your reverse proxy. Trust its X-Forwarded-Proto so the app
# marks cookies Secure and builds https:// links.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html>
    Options -Indexes -MultiViews
    AllowOverride None
</Directory>

<LocationMatch "^/(data|app|cli|tests|docs)/">
    Require all denied
</LocationMatch>
<LocationMatch "/\.">
    Require all denied
</LocationMatch>
<FilesMatch "\.(json|jsonl|bak|lock|md|example)$|^(config\.local\.php|LICENSE)$">
    Require all denied
</FilesMatch>
